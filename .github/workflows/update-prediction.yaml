name: Update Qualifying Prediction

on:
  schedule:
    - cron: '0 4 7 3 *'    # Australian
    - cron: '0 6 14 3 *'   # Chinese
    - cron: '0 5 28 3 *'   # Japanese
    - cron: '0 20 2 5 *'   # Miami
    - cron: '0 20 23 5 *'  # Canadian
    - cron: '0 14 6 6 *'   # Monaco
    - cron: '0 14 13 6 *'  # Barcelona
    - cron: '0 14 27 6 *'  # Austrian
    - cron: '0 15 4 7 *'   # British
    - cron: '0 14 18 7 *'  # Belgian
    - cron: '0 14 25 7 *'  # Hungarian
    - cron: '0 14 22 8 *'  # Dutch
    - cron: '0 14 5 9 *'   # Italian
    - cron: '0 14 12 9 *'  # Spanish
    - cron: '0 12 25 9 *'  # Azerbaijan
    - cron: '0 13 10 10 *' # Singapore
    - cron: '0 21 24 10 *' # United States
    - cron: '0 20 31 10 *' # Mexico City
    - cron: '0 17 7 11 *'  # São Paulo
    - cron: '0 3 21 11 *'  # Las Vegas
    - cron: '0 15 29 11 *' # Qatar
    - cron: '0 13 5 12 *'  # Abu Dhabi
  workflow_dispatch:

jobs:
  update-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run prediction script
        run: python python/laps_of_judgement.py

      - name: Commit and push updated prediction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update most recent session"
          git push