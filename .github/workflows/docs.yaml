name: Update Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'python/get_data.py'
      - 'R/model.R'
      - 'R/predict.R'

jobs:
  rerun-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run scripts
        run: |
          python python/get_data.py --year 2025
          Rscript R/model.R "Spanish Grand Prix" 2025
          Rscript R/predict.R "Spanish Grand Prix" 2025

      - name: Push script changes to documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update script changes to documentation"
          git push